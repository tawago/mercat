[general]
# Empty: use $VISUAL, then $EDITOR, then the first of nvim/vim/vi/nano on PATH.
# May include arguments, e.g. "code --wait".
editor = ""
pager = "less -R"

[display]
theme = "dark"
width = 0
line_numbers = false
heading_markers = true

[mermaid]
enabled = true
style = "rounded"

[files]
show_hidden = false
extensions = ["md", "markdown", "mdown", "mkd"]
