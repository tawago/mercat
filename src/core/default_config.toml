[general]
# Empty: use $VISUAL, then $EDITOR, then the first of nvim/vim/vi/nano on PATH.
# May include arguments, e.g. "code --wait".
editor = ""
pager = "less -R"

[display]
# Theme by name. Built-in presets:
#   dark, light, ansi (16-color terminal palette),
#   dracula, tokyo-night, pink, markview.
# Or the name of a user theme file at ~/.config/mercat/themes/<name>.toml.
# Override for one run with --theme <name> or MERCAT_THEME=<name>.
# `mercat --list-themes` lists every available name.
theme = "dark"
# Deprecated: superseded by the theme system. Still parsed so old configs load,
# but no longer selects a palette variant.
syntax_theme = "default"
# Wrap width: 0 = terminal width (plain/png export: 120), else 20..1000.
width = 0
# Color and OSC 8 hyperlinks: auto (only when stdout is a terminal), always,
# never. --color, NO_COLOR and CLICOLOR_FORCE/FORCE_COLOR take precedence.
color = "auto"

# Inline theme overrides layer on top of the selected theme. Each [theme.<slot>]
# table tweaks one element; absent keys inherit, an empty string "" clears an
# inherited value. Extend a preset with `extends`:
#   [theme]
#   extends = "dracula"
#   [theme.heading1]
#   fg = "#ff79c6"   # hex, an xterm-256 index, an ANSI color name, or "default"
#   prefix = "» "
#   bold = true
# Slots include heading1..heading6, body, quote, link, image, code, code_block,
# strong, emph, strike. See ~/.config/mercat/themes/ for full user theme files.
#
# Structural glyphs moved out of [display] into the theme system. The old flat
# [display] keys (quote_bar, bullet_glyphs, hr_glyph, task_checked, task_todo,
# table_border_set, heading_prefix) are gone; set them under [theme.glyphs]:
#   [theme.glyphs]
#   quote_bar = "▎"
#   bullets = ["•", "◦", "‣"]
#   hr_glyph = "─"
#   task_ticked = "[x]"
#   task_unticked = "[ ]"
#   # table_style accepts: grid (─│┼), heavy (━┃╋), double (═║╬), ascii (-|+),
#   # or rounded (─│ with ╭╮╰╯ corners).
#   table_style = "grid"
# Per-heading prefixes live on each [theme.headingN] slot's `prefix` key.
# How YAML front matter (--- metadata at the top of a file) is displayed:
#   "panel" (default) — banded metadata card
#   "dim"             — muted key/value list, no chrome
#   "compact"         — one status-bar-like line of key:value pairs
#   "raw"             — verbatim YAML including the --- fences
#   "hidden"          — stripped entirely
# Override for one run with MERCAT_FRONTMATTER=<style>.
frontmatter = "panel"

[mermaid]
# How an edge that crosses a subgraph frame border is drawn:
#   "bridge" (default) — frame stays solid, the edge bridges across it
#   "cross"            — legacy junction weld (a tee/cross on the border)
# Override for one run with MERCAT_SUBGRAPH_EDGES=bridge|cross.
subgraph_edges = "bridge"
