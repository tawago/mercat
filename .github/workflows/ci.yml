name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Lint file length
        run: bash tools/check_line_count.sh

      - name: Check versions agree
        run: bash tools/check_versions.sh

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Run public tests
        run: zig build -Doptimize=ReleaseSafe test

      - name: Verify version output
        run: zig build -Doptimize=ReleaseSafe run -- --version

      - name: Build the playground renderer
        run: zig build wasm

  release-cross-build:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install QEMU for foreign build helpers
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt

      - name: Build the Linux ARM release binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-linux-musl -fqemu
