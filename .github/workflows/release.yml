name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then v="${INPUT_VERSION#v}"; else v="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::not a version: $v"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the tag sits on main
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then echo "::error::$TAG already exists"; exit 1; fi
          elif [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$TAG is not the tip of main"; exit 1
          fi

      - name: Update every version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/options.addOption(\[\]const u8, \"version\", \"[^\"]*\");/options.addOption([]const u8, \"version\", \"$VERSION\");/" build.zig
          sed -i "s/\.version = \"[^\"]*\",/.version = \"$VERSION\",/" build.zig.zon
          sed -i "s/^\(  *\"version\": \)\"[^\"]*\"/\1\"$VERSION\"/" mods/mercat/.claude-plugin/plugin.json
          sed -i "s/^export const MOD_VERSION = '[^']*'/export const MOD_VERSION = '$VERSION'/" mods/mercat/hooks/mercat.ts
          bash tools/check_versions.sh "v$VERSION"
          bash tools/release_notes.sh "$VERSION" > /dev/null

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add build.zig build.zig.zon mods/mercat/.claude-plugin/plugin.json mods/mercat/hooks/mercat.ts CHANGELOG.md
            git commit -m "Prepare $VERSION release"
            git push origin main
          fi
          if [ "$(git rev-parse -q --verify "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            git tag -f "$TAG"
            git push -f origin "refs/tags/$TAG"
          fi

      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash tools/release_notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build-release:
    needs: [prepare-release]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-musl
            artifact: mercat-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-linux-musl
            artifact: mercat-linux-aarch64.tar.gz
          # Darwin must build on a macOS runner: the koino dependency runs a
          # generated tool (generate_entities) at build time, which cannot
          # execute when cross-compiling from Linux. The macOS runner needs
          # SDKROOT exported explicitly — the current runner image breaks
          # Zig's automatic libSystem/SDK discovery (undefined libSystem
          # symbols when linking the build runner itself).
          # Pinned to macos-15: the macos-latest image's newer Xcode SDK is
          # not parseable by Zig 0.15.1 (libSystem symbols resolve to nothing
          # even with SDKROOT set). Revisit the pin when bumping Zig.
          - os: macos-15
            target: x86_64-macos
            artifact: mercat-darwin-x86_64.tar.gz
          - os: macos-15
            target: aarch64-macos
            artifact: mercat-darwin-aarch64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Check versions agree with the tag
        shell: bash
        run: bash tools/check_versions.sh "$RELEASE_TAG"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install QEMU for foreign build helpers
        if: matrix.target == 'aarch64-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Build release binary
        shell: bash
        run: |
          if [ "$(uname)" = "Darwin" ]; then
            export SDKROOT="$(xcrun --show-sdk-path)"
          fi
          zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -fqemu

      - name: Package archive and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp zig-out/bin/mercat dist/mercat
          tar -C dist -czf ${{ matrix.artifact }} mercat
          shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  package-linux:
    runs-on: ubuntu-latest
    needs: [prepare-release, build-release]
    if: always() && needs.build-release.result == 'success'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tarball_arch: x86_64
            nfpm_arch: amd64
          - tarball_arch: aarch64
            nfpm_arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go (for nfpm)
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1

      - name: Download release binary
        run: |
          mkdir -p dist
          curl -fsSL "https://github.com/tawago/mercat/releases/download/${RELEASE_TAG}/mercat-linux-${{ matrix.tarball_arch }}.tar.gz" \
            | tar -xz -C dist
          chmod 755 dist/mercat

      - name: Build .deb and .rpm
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
        run: |
          export VERSION="${VERSION#v}"
          nfpm package -f packaging/nfpm.yaml -p deb -t "mercat_${VERSION}_${NFPM_ARCH}.deb"
          nfpm package -f packaging/nfpm.yaml -p rpm -t "mercat-${VERSION}.${{ matrix.tarball_arch }}.rpm"
          shasum -a 256 mercat_*.deb > "mercat_${VERSION}_${NFPM_ARCH}.deb.sha256"
          shasum -a 256 mercat-*.rpm > "mercat-${VERSION}.${{ matrix.tarball_arch }}.rpm.sha256"

      - name: Publish package assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            *.deb
            *.deb.sha256
            *.rpm
            *.rpm.sha256

  update-homebrew-tap:
    runs-on: ubuntu-latest
    needs: [prepare-release, build-release]
    if: always() && needs.build-release.result == 'success'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TAP_REPO: tawago/homebrew-tap
      FORMULA_PATH: Formula/mercat.rb
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set"
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          release_base="https://github.com/tawago/mercat/releases/download/${RELEASE_TAG}"

          darwin_arm_sha="$(curl -fsSL "${release_base}/mercat-darwin-aarch64.tar.gz.sha256" | cut -d' ' -f1)"
          darwin_x86_sha="$(curl -fsSL "${release_base}/mercat-darwin-x86_64.tar.gz.sha256" | cut -d' ' -f1)"
          linux_arm_sha="$(curl -fsSL "${release_base}/mercat-linux-aarch64.tar.gz.sha256" | cut -d' ' -f1)"
          linux_x86_sha="$(curl -fsSL "${release_base}/mercat-linux-x86_64.tar.gz.sha256" | cut -d' ' -f1)"

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" "$workdir/tap"

          mkdir -p "$workdir/tap/Formula"

          {
            printf '%s\n' 'class Mercat < Formula'
            printf '%s\n' '  desc "Fast terminal markdown viewer with Mermaid diagram support"'
            printf '%s\n' '  homepage "https://github.com/tawago/mercat"'
            printf '%s\n' "  version \"${version}\""
            printf '%s\n' '  license "GPL-3.0-or-later"'
            printf '\n'
            printf '%s\n' '  on_macos do'
            printf '%s\n' '    on_arm do'
            printf '%s\n' '      url "https://github.com/tawago/mercat/releases/download/v#{version}/mercat-darwin-aarch64.tar.gz"'
            printf '%s\n' "      sha256 \"${darwin_arm_sha}\""
            printf '%s\n' '    end'
            printf '\n'
            printf '%s\n' '    on_intel do'
            printf '%s\n' '      url "https://github.com/tawago/mercat/releases/download/v#{version}/mercat-darwin-x86_64.tar.gz"'
            printf '%s\n' "      sha256 \"${darwin_x86_sha}\""
            printf '%s\n' '    end'
            printf '%s\n' '  end'
            printf '\n'
            printf '%s\n' '  on_linux do'
            printf '%s\n' '    on_arm do'
            printf '%s\n' '      url "https://github.com/tawago/mercat/releases/download/v#{version}/mercat-linux-aarch64.tar.gz"'
            printf '%s\n' "      sha256 \"${linux_arm_sha}\""
            printf '%s\n' '    end'
            printf '\n'
            printf '%s\n' '    on_intel do'
            printf '%s\n' '      url "https://github.com/tawago/mercat/releases/download/v#{version}/mercat-linux-x86_64.tar.gz"'
            printf '%s\n' "      sha256 \"${linux_x86_sha}\""
            printf '%s\n' '    end'
            printf '%s\n' '  end'
            printf '\n'
            printf '%s\n' '  def install'
            printf '%s\n' '    bin.install "mercat"'
            printf '%s\n' '  end'
            printf '\n'
            printf '%s\n' '  test do'
            printf '%s\n' '    assert_match version.to_s, shell_output("#{bin}/mercat --version")'
            printf '%s\n' '  end'
            printf '%s\n' 'end'
          } > "$workdir/tap/${FORMULA_PATH}"

          if [ ! -f "$workdir/tap/README.md" ]; then
            {
              printf '%s\n' '# homebrew-tap'
              printf '\n'
              printf '%s\n' 'Homebrew tap for `mercat`.'
              printf '\n'
              printf '%s\n' '## Install'
              printf '\n'
              printf '%s\n' '```bash'
              printf '%s\n' 'brew install tawago/tap/mercat'
              printf '%s\n' '```'
            } > "$workdir/tap/README.md"
          fi

          cd "$workdir/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FORMULA_PATH" README.md
          # git diff --quiet misses untracked files (a freshly created
          # formula), so detect staged changes instead.
          if git diff --cached --quiet; then
            echo "Homebrew tap already up to date"
            exit 0
          fi

          git commit -m "Update mercat formula to ${version}"
          git push origin main
