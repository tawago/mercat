name: Pages

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - src/**
      - build.zig
      - build.zig.zon
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: site/play/mermaid-ascii/go.mod
          cache-dependency-path: site/play/mermaid-ascii/go.sum

      - name: Build the playground renderers
        run: bash site/play/build.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
